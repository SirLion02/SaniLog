<div id="step1-badge" hx-swap-oob="true" class="w-8 h-8 bg-teal-600/50 text-white border-2 border-white rounded-full flex items-center justify-center font-bold">
    1
</div>

<div id="step2-badge" hx-swap-oob="true" class="w-8 h-8 bg-white text-teal-600 rounded-full flex items-center justify-center font-bold shadow-sm">
    2
</div>

<div class="space-y-6">
    <h2 class="text-xl  text-gray-800">Catat sorting</h2>
    <p class="text-sm text-gray-500">Input berat tiap kategori sampah yang sudah kamu sortir. Boleh kosong kalau tidak ada.</p>

    <div class="space-y-4">
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Berat Per Kategori</label>

        <!-- Category Item -->
        <div class="flex items-center gap-4 p-3 bg-white border border-gray-100 rounded-xl shadow-sm">
            <div class="w-3 h-3 rounded-full bg-blue-500"></div>
            <div class="grow">
                <p class="text-sm font-medium text-gray-800">HVP</p>
                <p class="text-[10px] text-gray-400">High Value Plastics</p>
            </div>
            <div class="flex items-center gap-2">
                <input type="number" step="0.1" value="2.1" class="no-spinner w-16 px-2 py-1 text-right border border-gray-300 rounded-lg outline-none">
                <span class="text-xs text-gray-400">kg</span>
            </div>
        </div>

        <div class="flex items-center gap-4 p-3 bg-white border border-gray-100 rounded-xl shadow-sm">
            <div class="w-3 h-3 rounded-full bg-green-500"></div>
            <div class="grow">
                <p class="text-sm font-medium text-gray-800">LVP</p>
                <p class="text-[10px] text-gray-400">Low Value Plastics</p>
            </div>
            <div class="flex items-center gap-2">
                <input type="number" step="0.1" value="3.4" class="no-spinner w-16 px-2 py-1 text-right border border-gray-300 rounded-lg outline-none">
                <span class="text-xs text-gray-400">kg</span>
            </div>
        </div>

        <div class="flex items-center gap-4 p-3 bg-white border border-gray-100 rounded-xl shadow-sm">
            <div class="w-3 h-3 rounded-full bg-emerald-400"></div>
            <div class="grow">
                <p class="text-sm font-medium text-gray-800">Organik</p>
                <p class="text-[10px] text-gray-400">Organic Waste</p>
            </div>
            <div class="flex items-center gap-2">
                <input type="number" step="0.1" value="1.5" class="no-spinner w-16 px-2 py-1 text-right border border-gray-300 rounded-lg outline-none">
                <span class="text-xs text-gray-400">kg</span>
            </div>
        </div>

        <div class="flex items-center gap-4 p-3 bg-white border border-gray-100 rounded-xl shadow-sm">
            <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
            <div class="grow">
                <p class="text-sm font-medium text-gray-800">Residue</p>
                <p class="text-[10px] text-gray-400">Non-plastic waste</p>
            </div>
            <div class="flex items-center gap-2">
                <input type="number" step="0.1" value="1.8" class="no-spinner w-16 px-2 py-1 text-right border border-gray-300 rounded-lg outline-none">
                <span class="text-xs text-gray-400">kg</span>
            </div>
        </div>

        <div class="flex items-center gap-4 p-3 bg-white border border-gray-100 rounded-xl shadow-sm">
            <div class="w-3 h-3 rounded-full bg-red-500"></div>
            <div class="grow">
                <p class="text-sm font-medium text-gray-800">B3</p>
                <p class="text-[10px] text-gray-400">Bahan Berbahaya & Beracun</p>
            </div>
            <div class="flex items-center gap-2">
                <input type="number" step="0.1" value="0" class="no-spinner w-16 px-2 py-1 text-right border border-gray-300 rounded-lg outline-none">
                <span class="text-xs text-gray-400">kg</span>
            </div>
        </div>
    </div>

    <div class="bg-teal-50 p-4 rounded-xl flex justify-between items-center mb-6">
        <span class="text-sm font-medium text-gray-600">Total berat sortir</span>
        <span class="text-xl font-bold text-teal-600">8.8 kg</span>
    </div>

    <button hx-post="/session/save" hx-target="body" class="w-full bg-teal-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-teal-700 transition">
        Simpan sesi ✓
    </button>
</div>
