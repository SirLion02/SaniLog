{{define "title"}}Login - Weekleen{{end}}

{{define "content"}}
<div class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-teal-600">SaniLog</h1>
            <p class="text-gray-500 mt-2">Masuk atau buat akun baru</p>
        </div>

        <!-- Request POST via HTMX ke LoginSubmitHandler [3] -->
        <form hx-post="/login-submit" hx-target="#error-msg" class="space-y-6">
            <div id="error-msg"></div> <!-- Tempat pesan error dari server -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username_or_email" placeholder="Hara_Ganteng"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-600 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" placeholder="••••••••"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-600 outline-none">
            </div>
            <button type="submit"
                class="w-full bg-teal-600 text-white py-2 rounded-lg font-semibold hover:bg-teal-700 transition">
                Masuk
            </button>
        </form>
        <div class="text-center mt-6 text-sm text-gray-600">
            Belum punya akun? <a href="#" class="text-teal-600 font-semibold hover:underline">Daftar</a>
        </div>
    </div>
</div>
{{end}}
