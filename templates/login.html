{{define "title"}}Login - Weekleen{{end}}

{{define "content"}}

<div class="min-h-screen flex items-center justify-center">

    <!-- Title Login -->
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-sm">
        <h1 class="text-2xl font-bold text-teal-600 text-center">SaniLog</h1>
        <p class="text-sm text-gray-500 text-center mt-1">Masuk ke akun kamu</p>

        <!--form input -->
        <form class="">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1 mt-1">Username/Email</label>
                <input type="email" class="w-full border border-gray-300 rounded-lg px-1 py-1" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1 mt-1">Password</label>
                <input type="password" class="w-full border border-gray-300 rounded-lg px-1 py-1" />
            </div>

            <button type="submit" class="w-full bg-teal-600 text-white mt-4 rounded-lg py-2">Masuk</button>

        </form>
    </div>

</div>

{{end}}
