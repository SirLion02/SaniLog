{{define "title"}}Catat Sesi - Weekleen{{end}}

{{define "content"}}
<div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">

    <!-- Header Step Indicator -->
    <div class="bg-teal-600 p-6 text-white rounded-b-3xl shadow-lg">
        <div class="flex items-center justify-between mb-6">
            <a href="/dashboard" class="hover:text-gray-200 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <span class="text-sm font-medium opacity-80">WEEKLEEN #48</span>
            <div class="w-6"></div> <!-- Spacer -->
        </div>

        <!-- Step Tracker -->
        <div class="flex justify-between items-center relative">
            <div class="z-10 flex flex-col items-center">
                <div id="step1-badge"
                    class="w-8 h-8 bg-white text-teal-600 rounded-full flex items-center justify-center font-bold shadow-sm">
                    1</div>
                <span class="text-[10px] mt-1 font-medium">Clean up</span>
            </div>

            <!-- Progress Line -->
            <div class="absolute top-4 left-0 w-full h-0.5 bg-white/30 z-0"></div>

            <div class="z-10 flex flex-col items-center">
                <div id="step2-badge"
                    class="w-8 h-8 bg-teal-600/50 text-white border-2 border-white rounded-full flex items-center justify-center font-bold">
                    2</div>
                <span class="text-[10px] mt-1 font-medium">Sorting</span>
            </div>
        </div>
    </div>

    <!-- Form Container (Target HTMX) -->
    <div id="session-form-container" class="p-6 grow">
        <!-- Awalnya memuat Step 1 -->
        <div id="step-content">
            <!-- Render Step 1 (Clean Up) -->
            <div class="space-y-6">
                <h2 class="text-xl font-bold text-gray-800">Catat clean up</h2>

                <!-- Lokasi -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">📍 Lokasi</label>
                    <input type="text" name="lokasi" placeholder="cth: Sungai Ciliwung, Depok"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-600 outline-none transition">
              </div>

                <!-- Waktu -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">🕒 Mulai</label>
                        <input type="time" name="jam_mulai"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">🕒 Selesai</label>
                        <input type="time" name="jam_selesai"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-600 outline-none">
                    </div>
                </div>

                <!-- Jumlah Karung -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Total Karung</label>
                    <input type="number" name="total_karung" placeholder="0"
                        class="no-spinner w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-600 outline-none">
                </div>

                <!-- Berat per Karung -->
                <div class="space-y-3">
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Berat per Karung</label>
                    <div class="flex gap-2 items-center bg-gray-50 p-3 rounded-xl border border-gray-200">
                        <span
                            class="w-6 h-6 bg-teal-600 text-white text-xs flex items-center justify-center rounded-full">1</span>
                        <span class="text-sm grow text-gray-600">Karung 1</span>
                        <input type="number" placeholder="0.0"
                            class="no-spinner w-20 px-2 py-1 text-right border border-gray-300 rounded-lg outline-none">
                        <span class="text-xs text-gray-400">kg</span>
                    </div>
                    <!-- Tambah Karung Button -->
                    <button type="button"
                        class="w-full py-2 border-2 border-dashed border-gray-200 rounded-xl text-gray-400 text-sm hover:border-teal-600 hover:text-teal-600 transition">
                        + Tambah karung
                    </button>
                </div>

                <!-- Total Weight Display -->
                <div class="bg-teal-50 p-4 rounded-xl flex justify-between items-center">
                    <span class="text-sm font-medium text-gray-600">Total berat</span>
                    <span class="text-xl font-bold text-teal-600">9.5 kg</span>
                </div>

                <!-- Next Button via HTMX -->
                <button hx-get="/session/step-2" hx-target="#step-content"
                    class="w-full bg-teal-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-teal-700 transition">
                    Lanjut ke Sorting →
                </button>
            </div>
        </div>
    </div>
</div>
{{end}}
